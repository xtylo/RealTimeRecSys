[project]
name = "realtime-recsys"
version = "0.1.0"
description = "Sistema de recomendación en tiempo real para e-commerce (FastAPI + AWS Lambda + S3 + LangChain)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "pydantic>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
